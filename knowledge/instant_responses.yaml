# SAM — Instant Responses
#
# Expressions listed here bypass the LLM entirely; SAM responds with zero latency (~0 ms).
#
# Fields:
#   patterns : Phrases to match (case, punctuation, and character accents are normalized).
#   response : Single string or list of candidate responses (selected randomly).
#   lang     : tr | en  → {time}/{date}/{day} placeholder locale.
#   match    : exact (default, fast hash map lookup) | contains (substring match).
#
# Placeholders: {time} {date} {day}

responses:

