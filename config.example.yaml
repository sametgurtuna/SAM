app:
  name: SAM
  version: 0.4.1
hotkey:
  trigger: ctrl+space          # hold to speak
  text_input: ctrl+shift+space # open the typed-input box
ui:
  overlay:
    style: orb                 # orb (always-visible circle) | bar (legacy bottom bar)
  orb:
    size: 120                  # core disc diameter in px
    glow_padding: 28           # window margin reserved for the outer glow
    ring_width: 3
    opacity: 0.95
    label: SAM
    idle_fps: 12               # breathing framerate — SAM runs 24/7, keep this low
    active_fps: 60
    idle_animation: true       # false = orb stops painting entirely when idle (0% CPU)
    breathe_period_ms: 4000
    spike_count: 36            # radial spikes drawn while listening/speaking
    layer: auto                # auto (bottom of z-order until called, then on top) | topmost | normal
    hide_on_fullscreen: true
    click_through: true        # mouse passes through everything except the circle
    caption_width: 560
    caption_gap: 18
    caption_max_lines: 6
    position:
      anchor: bottom-right     # bottom-right | bottom-center | custom (set by Ctrl+drag)
      x: null
      y: null
      screen: null
      margin: 48
  bar:
    width: 800
    height: 80
    border_radius: 16
    margin_bottom: 40
    opacity: 0.68
  animation:
    slide_duration_ms: 220
    fade_duration_ms: 180
    text_stream_interval_ms: 45
  auto_hide:
    delay_seconds: 4
  colors:
    background: rgba(10, 10, 15, 0.92)
    accent: '#00D4AA'
    accent_thinking: '#38F2D8'
    accent_speaking: '#00D4AA'
    accent_listening: '#00BFFF'
    text_primary: '#E8E8E8'
    text_secondary: '#888888'
    border: rgba(0, 212, 170, 0.15)
  fonts:
    primary: Segoe UI
    monospace: Cascadia Code
    fallback: Consolas
    size_transcript: 15
    size_status: 11
waveform:
  bar_count: 35
  fps: 60
  min_height: 3
  max_height: 32
  bar_width: 3
  bar_gap: 2
  color: '#00D4AA'
mock:
  listening_duration_ms: 2500
  thinking_duration_ms: 1200
  user_transcript: What's the weather like today?
  assistant_response: It's 24°C and sunny in Istanbul right now. Perfect day to go outside.
logging:
  level: DEBUG
  file: logs/sam.log
audio:
  sample_rate: 16000
  channels: 1
  dtype: int16
  silence_threshold: 300
  silence_duration_ms: 1800
  max_record_seconds: 30
wake_word:
  engine: openwakeword
  model: assets/models/hey_sam.onnx
  threshold: 0.4               # lower = easier to trigger (more false positives)
  chunk_size: 1280
stt:
  engine: faster-whisper
  model: small
  language: en
  beam_size: 1
  device: cpu
  compute_type: int8
tts:
  engine: edge-tts
  voice: en-US-GuyNeural
  rate: +0%
  volume: +0%
llm:
  context_window: 5
  system_prompt: 'You are SAM, a fast and helpful desktop voice assistant. Rules: Give short, direct answers (1-3 sentences)
    unless asked to elaborate. Be conversational but efficient. No filler, no fluff. Respond naturally as if speaking — your
    response will be read aloud. If asked to write code, ALWAYS put the code inside markdown code blocks (```language ...
    ```) and do not explain the code line by line. For everything else, don''t use markdown, bullet points, or formatting
    — plain spoken text only. If you don''t know something, say so briefly.

    '
  ollama:
    base_url: http://localhost:11434
    model: qwen2.5:3b
    vision_model: llava
    temperature: 0.7
    max_tokens: 256
    keep_alive: 30m               # keep the model resident in RAM/VRAM between requests
    num_ctx: 2048                 # smaller context = faster prompt processing
    autostart: true              # start "ollama serve" in the background when SAM launches
    executable: ""               # blank = auto-discover (PATH, %LOCALAPPDATA%, Program Files)
    startup_timeout_seconds: 20
    stop_on_exit: false          # never kill a server the user already had running
    availability_ttl_seconds: 30
  claude:
    model: claude-sonnet-4-20250514
    max_tokens: 256
spotify:
  client_id: ""
  client_secret: ""
  redirect_uri: "http://127.0.0.1:8080"